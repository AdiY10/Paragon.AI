# Password-access host with web, job worker and scheduler in one container.
# Do not provision before owner cost approval (see docs/DEPLOYMENT.md, Release 1 runbook).
services:
  - type: web
    name: paragon-radar
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    autoDeployTrigger: 'off'
    healthCheckPath: /health/
    # Web + background job worker + scheduler in one container (the private disk attaches to one service).
    dockerCommand: python infra/start_all.py
    disk:
      name: paragon-private-evidence
      mountPath: /app/var/artifacts
      sizeGB: 5
    # Disk is unavailable to pre-deploy commands. The container prepares releases
    # at startup, after the private disk is mounted, before starting Gunicorn.
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: paragon-radar-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PASSWORD_ACCESS_ENABLED
        value: 'true'
      - key: ACCESS_BOOTSTRAP_EMAIL
        sync: false
      - key: ACCESS_BOOTSTRAP_PASSWORD
        sync: false
      - key: SOURCE_ARTIFACT_ROOT
        value: /app/var/artifacts
      - key: WEB_CONCURRENCY
        value: '1'
      - key: TRUST_PROXY_SSL_HEADER
        value: 'true'
      - key: RUN_BACKGROUND_WORKERS
        value: 'true'
      - key: OVERTURE_MEMORY_LIMIT
        value: 256MB
      - key: SEC_USER_AGENT
        sync: false
      - key: BLS_API_KEY
        sync: false

databases:
  - name: paragon-radar-db
    databaseName: paragon
    user: paragon
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
