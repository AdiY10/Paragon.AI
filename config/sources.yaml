- id: SRC-01
  name: Census Geocoder
  provider: U.S. Census Bureau
  purpose: Resolve address pins and census geographies
  coverage: US addresses
  documentation_url: https://geocoding.geo.census.gov/geocoder/Geocoding_Services_API.html
  licence: U.S. government public data; retain source citation and published caveats.
  attribution: U.S. Census Bureau
  cadence: on_demand
  stale_after_days: null
  privacy_note: Only required data lookups are sent to this provider; no analytics
    or session replay.
- id: SRC-02
  name: Nominatim fallback
  provider: OpenStreetMap Foundation
  purpose: Fallback for nonconfidential public-address lookups
  coverage: Global addresses; policy-limited fallback
  documentation_url: https://operations.osmfoundation.org/policies/nominatim/
  licence: ODbL; comply with Nominatim usage policy.
  attribution: © OpenStreetMap contributors
  cadence: on_demand
  stale_after_days: null
  privacy_note: Disabled by default for confidential candidates; no autocomplete or
    bulk queries; application-wide maximum one request per second with caching and
    identifying User-Agent.
